<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}WeThePeople{% endblock title%}</title>

  <link rel="shortcut icon" href="{{ url_for('static', filename='favicon.ico') }}" />

  <link href="https://cdn.jsdelivr.net/npm/halfmoon@2.0.2/css/halfmoon.min.css" rel="stylesheet"
    integrity="sha256-RjeFzczeuZHCyS+Gvz+kleETzBF/o84ZRHukze/yv6o=" crossorigin="anonymous" />

  <link rel="stylesheet" href="{{url_for('static', filename='styles/reset.css')}}" />
  <link rel="stylesheet" href="{{url_for('static', filename='styles/style.css')}}" />
</head>

<body>
  <nav class="navbar navbar-expand-lg" style="
        background-color: var(--bs-content-bg);
        border-bottom: var(--bs-border-width) solid
          var(--bs-content-border-color);
      ">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{url_for('home')}}">
        <img src="{{url_for('static', filename='logo.png')}}" alt="Logo" width="24" height="24"
          class="d-inline-block align-text-top" />
        WeThePeople
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbar-collapse-1"
        aria-controls="navbar-collapse-1" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbar-collapse-1">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/' %}active{% endif %}" {% if request.path=='/'
              %}aria-current="page" {% endif %} href="{{url_for('home')}}">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link {% if request.path == '/poll' %}active{% endif %}" {% if request.path=='/poll'
              %}aria-current="page" {% endif %} href="{{url_for('pollPage')}}">Poll</a>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  {% block content %} {% endblock content %}

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
    integrity="sha256-CDOy6cOibCWEdsRiZuaHf8dSGGJRYuBGC+mjoJimHGw=" crossorigin="anonymous"></script>
</body>

</html>
